name: Auto-update active branches from main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-main
  cancel-in-progress: false

jobs:
  update:
    name: update-open-pr-and-feature-branches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update active first-party branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail

          git fetch origin main --prune
          default_branch="main"
          failed=0

          mapfile -t branches < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPO}/branches?per_page=100" \
              --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            [ -n "$branch" ] || continue
            [ "$branch" != "$default_branch" ] || continue
            case "$branch" in
              auto-update/*|auto-repair/*) 
                echo "Skipping automation branch: $branch"
                continue
                ;;
            esac

            echo "Updating branch: $branch"
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || {
              echo "Could not fetch $branch; continuing."
              failed=1
              continue
            }

            worktree="$(mktemp -d)"
            if ! git worktree add --detach "$worktree" "origin/${branch}" >/dev/null 2>&1; then
              echo "Could not create worktree for $branch; continuing."
              rm -rf "$worktree"
              failed=1
              continue
            fi

            (
              cd "$worktree"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              if git merge --no-edit "origin/main"; then
                git push origin "HEAD:refs/heads/${branch}"
                echo "Updated $branch from main."
              else
                echo "Conflict or merge failure on $branch; leaving it unchanged."
                git merge --abort >/dev/null 2>&1 || true
                exit 20
              fi
            )
            status=$?
            git worktree remove --force "$worktree" >/dev/null 2>&1 || true
            rm -rf "$worktree"

            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more branches could not be updated. Other branches were processed."
          else
            echo "All active first-party branches were updated successfully."
          fi

      - name: Refresh PR branches through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          prs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${REPO}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | [.number, .head.ref, .head.repo.full_name] | @tsv')"

          [ -n "$prs" ] || { echo "No open PRs targeting main."; exit 0; }

          while IFS=$'\t' read -r number branch head_repo; do
            [ -n "${number:-}" ] || continue
            [ "$head_repo" = "$REPO" ] || continue
            echo "Refreshing PR #${number} (${branch})"
            if gh api --method PUT \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPO}/pulls/${number}/update-branch" \
              -f update_method=merge >/dev/null; then
              echo "PR #${number}: current or updated."
            else
              echo "PR #${number}: GitHub could not update automatically; branch was left unchanged."
            fi
          done <<< "$prs"
