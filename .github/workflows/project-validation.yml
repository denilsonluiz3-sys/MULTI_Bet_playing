name: Project Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-validation:
    name: project-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f MULTI_Bet_playing_Demo.csproj
          test -f MauiProgram.cs
          test -d Pages
          test -d Services
          test -d Models
          test -d Platforms/Android
          test -f tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore application
        run: dotnet restore MULTI_Bet_playing_Demo.csproj

      - name: Build Android Debug
        run: dotnet build MULTI_Bet_playing_Demo.csproj --configuration Debug --framework net10.0-android --no-restore

      - name: Restore tests
        run: dotnet restore tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj

      - name: Run unit tests
        run: dotnet test tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj --configuration Release --no-restore --verbosity normal

  security-validation:
    name: security-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
