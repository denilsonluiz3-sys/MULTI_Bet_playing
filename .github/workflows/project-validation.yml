name: Project Validation

env:
  CI_SCHEMA_VERSION: '2'

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f MauiProgram.cs
          test -d Pages
          test -d Services
          test -d Models
          test -d Platforms/Android
          find . -maxdepth 3 -type f -name '*.csproj' -not -path './tests/*' -print -quit | grep -q .
          find tests -type f -name '*.csproj' -print -quit | grep -q .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore application
        shell: bash
        run: |
          set -euo pipefail
          app_project="$(find . -maxdepth 3 -type f -name '*.csproj' -not -path './tests/*' -print -quit)"
          test -n "$app_project"
          dotnet restore "${app_project#./}"

  test-validation:
    name: test-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Locate test projects
        id: projects
        shell: bash
        run: |
          set -euo pipefail
          test_projects="$(find tests -type f -name '*.csproj' -print)"
          test -n "$test_projects"
          {
            echo 'test_projects<<EOF'
            printf '%s\n' "$test_projects"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            test -z "$project" && continue
            dotnet restore "$project"
          done <<< '${{ steps.projects.outputs.test_projects }}'

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            test -z "$project" && continue
            dotnet test "$project" --configuration Release --no-restore --verbosity normal
          done <<< '${{ steps.projects.outputs.test_projects }}'

  android-validation:
    name: android-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate application project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          app_project="$(find . -maxdepth 3 -type f -name '*.csproj' -not -path './tests/*' -print -quit)"
          test -n "$app_project"
          echo "app_project=${app_project#./}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore application
        run: dotnet restore "${{ steps.project.outputs.app_project }}"

      - name: Build Android Debug
        run: dotnet build "${{ steps.project.outputs.app_project }}" --configuration Debug --framework net10.0-android --no-restore

  security-validation:
    name: security-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
