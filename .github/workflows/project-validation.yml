name: Project Validation

env:
  CI_SCHEMA_VERSION: '3'

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            MauiProgram.cs
            MULTI_Bet_playing_Demo.csproj
            tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj
          )
          required_dirs=(
            Pages
            Services
            Models
            Platforms/Android
            tests
          )

          for path in "${required_files[@]}"; do
            test -f "$path"
          done

          for path in "${required_dirs[@]}"; do
            test -d "$path"
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            MULTI_Bet_playing_Demo.csproj
            tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj

      - name: Restore application
        run: dotnet restore MULTI_Bet_playing_Demo.csproj

  test-validation:
    name: test-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            MULTI_Bet_playing_Demo.csproj
            tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj

      - name: Restore tests
        run: dotnet restore tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj

      - name: Run unit tests
        run: dotnet test tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj --configuration Release --no-restore --verbosity normal

  android-validation:
    name: android-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: MULTI_Bet_playing_Demo.csproj

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore application
        run: dotnet restore MULTI_Bet_playing_Demo.csproj

      - name: Build Android Debug
        run: dotnet build MULTI_Bet_playing_Demo.csproj --configuration Debug --framework net10.0-android --no-restore

  security-validation:
    name: security-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
