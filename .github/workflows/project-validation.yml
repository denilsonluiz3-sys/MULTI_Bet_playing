name: CI

env:
  DOTNET_VERSION: '10.0.x'

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            README.md \
            MauiProgram.cs \
            MULTI_Bet_playing_Demo.csproj \
            tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj \
            Services/UrlValidator.cs \
            Services/ComplianceService.cs \
            Services/WebViewSecurity.cs \
            Services/CardService.cs; do
            test -f "$path"
          done
          for path in Pages Models Platforms/Android Services tests src/MULTI_Bet.Api src/MULTI_Bet.Infrastructure src/MULTI_Bet.Shared; do
            test -d "$path"
          done

  tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj
      - name: Restore tests
        run: dotnet restore tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj
      - name: Run tests
        run: dotnet test tests/MULTI_Bet_playing_Demo.Tests/MULTI_Bet_playing_Demo.Tests.csproj --configuration Release --no-restore --verbosity normal

  backend:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            src/MULTI_Bet.Shared/MULTI_Bet.Shared.csproj
            src/MULTI_Bet.Infrastructure/MULTI_Bet.Infrastructure.csproj
            src/MULTI_Bet.Api/MULTI_Bet.Api.csproj
      - name: Restore backend
        run: dotnet restore src/MULTI_Bet.Api/MULTI_Bet.Api.csproj
      - name: Build backend
        run: dotnet build src/MULTI_Bet.Api/MULTI_Bet.Api.csproj --configuration Release --no-restore

  android:
    name: android-build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: MULTI_Bet_playing_Demo.csproj
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restore application
        run: dotnet restore MULTI_Bet_playing_Demo.csproj
      - name: Build Android Debug
        run: dotnet build MULTI_Bet_playing_Demo.csproj --configuration Debug --framework net10.0-android --no-restore

  security:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
