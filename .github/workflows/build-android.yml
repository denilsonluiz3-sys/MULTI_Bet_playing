name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android
          dotnet workload list

      - name: Restore
        run: dotnet restore MULTI_Bet_playing_Demo.csproj

      - name: Build Debug
        run: dotnet build MULTI_Bet_playing_Demo.csproj -c Debug -f net10.0-android --no-restore

      - name: Publish APK (Release)
        run: |
          dotnet publish MULTI_Bet_playing_Demo.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormats=apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multibet-apk
          path: |
            **/bin/Release/**/*.apk
            **/bin/Debug/**/*.apk
          if-no-files-found: warn

      - name: Upload ProGuard mapping (if present)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multibet-mapping
          path: '**/mapping.txt'
          if-no-files-found: ignore
