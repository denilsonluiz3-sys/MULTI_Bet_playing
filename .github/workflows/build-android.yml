name: Build Android APK

on:
  workflow_run:
    workflows: ["Project Validation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android
          dotnet workload list

      - name: Restore
        run: dotnet restore MULTI_Bet_playing_Demo.csproj

      - name: Publish APK (Release)
        run: |
          dotnet publish MULTI_Bet_playing_Demo.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormats=apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multibet-apk
          path: '**/bin/Release/**/*.apk'
          if-no-files-found: error

      - name: Upload ProGuard mapping (if present)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multibet-mapping
          path: '**/mapping.txt'
          if-no-files-found: ignore
