name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAUI_PROJECT: MULTI_Bet_playing_Demo.csproj
      ANDROID_FRAMEWORK: net10.0-android
      ANDROID_RUNTIME: android-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify MAUI project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MAUI_PROJECT"
          grep -q '<UseMaui>true</UseMaui>' "$MAUI_PROJECT"
          grep -q "<TargetFramework>$ANDROID_FRAMEWORK</TargetFramework>" "$MAUI_PROJECT"
          test -d Platforms/Android
          test -d Resources
          test -f App.xaml
          echo "MAUI project: $MAUI_PROJECT"
          echo "Target framework: $ANDROID_FRAMEWORK"
          echo "Runtime: $ANDROID_RUNTIME"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: MULTI_Bet_playing_Demo.csproj

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore Android Release
        run: |
          dotnet restore "$MAUI_PROJECT" \
            --framework "$ANDROID_FRAMEWORK" \
            --runtime "$ANDROID_RUNTIME"

      - name: Publish APK
        run: |
          dotnet publish "$MAUI_PROJECT" \
            --configuration Release \
            --framework "$ANDROID_FRAMEWORK" \
            --runtime "$ANDROID_RUNTIME" \
            --no-restore \
            -p:AndroidPackageFormats=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multibet-apk-${{ github.sha }}
          path: '**/bin/Release/**/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multibet-mapping-${{ github.sha }}
          path: '**/mapping.txt'
          if-no-files-found: ignore
          retention-days: 14
