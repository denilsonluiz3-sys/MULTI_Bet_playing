name: Android

env:
  DOTNET_VERSION: '10.0.x'
  ANDROID_FRAMEWORK: 'net10.0-android'

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MAUI Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: MULTI_Bet_playing_Demo.csproj
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restore
        run: dotnet restore MULTI_Bet_playing_Demo.csproj
      - name: Build Android
        run: dotnet build MULTI_Bet_playing_Demo.csproj --configuration Release --framework ${{ env.ANDROID_FRAMEWORK }} --no-restore
